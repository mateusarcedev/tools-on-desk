<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182224" />
      <stop offset="50%" stop-color="#12181A" />
      <stop offset="100%" stop-color="#0B0F10" />
    </linearGradient>

    <!-- Mint Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36FFCE" />
      <stop offset="100%" stop-color="#15F5BA" />
    </linearGradient>

    <!-- Deep Teal Accent -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15F5BA" />
      <stop offset="100%" stop-color="#076B39" />
    </linearGradient>

    <!-- Top Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3B3E" />
      <stop offset="100%" stop-color="#182224" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#15F5BA" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Inner Ambient Border -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.06" />

  <!-- Desk Surface Plane (Geometric Workstation Isometric Facet) -->
  <g filter="url(#glow)">
    <!-- Top Horizontal Bar (Desk Crossbeam / 'T' Top) -->
    <path d="M120 160 C120 148, 130 140, 142 140 L370 140 C382 140, 392 148, 392 160 L392 188 C392 200, 382 208, 370 208 L142 208 C130 208, 120 200, 120 188 Z" fill="url(#mintGrad)" />

    <!-- Center Column ('T' Stem into 'D' Desktop Workstation Core) -->
    <path d="M224 208 L288 208 L288 352 C288 364, 278 372, 266 372 L246 372 C234 372, 224 364, 224 352 Z" fill="url(#tealGrad)" />

    <!-- Right Dynamic Workstation Loop ('D' Workspace Enclosure) -->
    <path d="M288 224 C348 224, 388 260, 388 310 C388 360, 348 396, 288 396 L220 396 C206 396, 196 386, 196 372 L196 348 L266 348 C306 348, 332 328, 332 310 C332 292, 306 272, 266 272 L224 272 L224 224 Z" fill="url(#mintGrad)" opacity="0.95" />

    <!-- Isometric Diamond Accent (Creative Precision Point) -->
    <polygon points="156,268 184,240 184,296" fill="#36FFCE" opacity="0.8" />
  </g>
</svg>
